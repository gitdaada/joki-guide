name: Selvitysajo
on:
  push:
    branches: [tutkimus]
    paths: [tutkimus/tutki.py, .github/workflows/tutkimus.yml]
permissions:
  contents: write
jobs:
  tutki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tutkimus/tutki.py
      - name: Tallenna tulokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutkimus/out
          git commit -m "Selvitysajon tulokset" || echo "ei muutoksia"
          git push
