name: Vianetsinta
on:
  push:
    branches: [tutkimus]
    paths: [tutkimus/debug.py, .github/workflows/vesitesti.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tutkimus/debug.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutkimus/out/debug.json
          git commit -m "Vianetsinnän tulokset" || echo "ei muutoksia"
          git push
