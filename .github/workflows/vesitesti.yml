name: Vesitilanne (testi)
on:
  push:
    branches: [tutkimus]
    paths: [pipeline/**, .github/workflows/vesitesti.yml]
permissions:
  contents: write
jobs:
  vesi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/vesitilanne.py
      - name: Tallenna tulokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/layers
          git commit -m "Vesitilanne (testi)" || echo "ei muutoksia"
          git push
