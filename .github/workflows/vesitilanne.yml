# Päivittää jokien vesitilanteen (docs/data/vesitilanne.json) kerran päivässä.
# Vain julkisia rajapintoja (Syke, Ilmatieteen laitos, OpenStreetMap), ei salaisuuksia eikä avaimia.
name: Vesitilanne
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pipeline/**]
permissions:
  contents: write
concurrency:
  group: vesitilanne
  cancel-in-progress: false
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Laske vesitilanne
        run: python3 pipeline/vesitilanne.py
      - name: Tallenna muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/vesitilanne.json docs/layers/*-joet.geojson
          git commit -m "Vesitilanne päivitetty" || exit 0
          # Jos toinen ajo ehti tallentaa ensin, tämän ajon tuoreempi data voittaa.
          git pull --rebase -X theirs -q origin main
          git push
